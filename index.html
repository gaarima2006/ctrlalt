    const parseCSVText = (text) => {
      const lines = text.trim().split(/\r\n|\n/);
      if (lines.length < 2) return { success: false, message: 'CSV requires a header row and at least one data row.' };

      const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/['"]/g, ''));
      const parsedInvoices = [];
      const parsedExpenses = [];
      let detectedCash = null;

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
        if (row.length < 2 || !row.some(Boolean)) continue;

        const rowObj = {};
        headers.forEach((h, idx) => {
          rowObj[h] = row[idx] !== undefined ? row[idx] : '';
        });

        const type = (rowObj.type || rowObj.category || (parseFloat(rowObj.amount) < 0 ? 'expense' : 'income')).toLowerCase();
        const amount = Math.abs(parseFloat(rowObj.amount || rowObj.value || 0));
        const title = rowObj.title || rowObj.name || rowObj.description || rowObj.client || `Item #${i}`;
        const day = parseInt(rowObj.day || rowObj.duedate || rowObj.date || '15', 10) || 15;

        if (rowObj.type === 'balance' || title.toLowerCase().includes('opening cash')) {
          detectedCash = amount;
          continue;
        }

        if (type.includes('invoice') || type.includes('income') || type.includes('receivable') || type.includes('revenue')) {
          parsedInvoices.push({
            id: `csv-inv-${Date.now()}-${i}`,
            client: title,
            amount: isNaN(amount) ? 1000 : amount,
            dueDate: Math.min(Math.max(1, day), 90),
            confidence: (rowObj.confidence || 'medium').toLowerCase(),
            status: 'pending',
            delayDays: 0,
            contactName: title.split(' ')[0] || 'Partner',
            email: 'billing@client.com'
          });
        } else {
          parsedExpenses.push({
            id: `csv-exp-${Date.now()}-${i}`,
            title: title,
            amount: isNaN(amount) ? 500 : amount,
            dueDayOfInterval: [Math.min(Math.max(1, day), 90)],
            category: (rowObj.category || 'Vendor'),
            essential: !['marketing', 'discretionary', 'capex', 'office perks'].some(k => (rowObj.category || '').toLowerCase().includes(k)),
            delayedDays: 0
          });
        }
      }

      return {
        success: true,
        detectedCash,
        invoices: parsedInvoices,
        expenses: parsedExpenses,
        totalRows: parsedInvoices.length + parsedExpenses.length
      };
    };

          invoices.forEach(inv => {
            if (inv.status === 'paid') return;

          expenses.forEach(exp => {

              dayOutflow += exp.amount;

          if (day > 0) {
            baseBalance = baseBalance + dayInflowBase - dayOutflow;
            worstBalance = worstBalance + dayInflowWorst - (dayOutflow * 1.05);
            bestBalance = bestBalance + dayInflowBest - dayOutflow;

          if (baseBalance < minBase) minBase = baseBalance;
          if (baseBalance < 0 && firstCrunch === null) {
            firstCrunch = day;

          baseCurve.push({
            day,
            base: Math.round(baseBalance),
            worst: Math.round(worstBalance),
            best: Math.round(bestBalance),
            inflow: dayInflowBase,
            outflow: dayOutflow,

          let simDayOutflow = 0;

            const effectiveDueDays = dueList.map(d => d + (exp.delayedDays || 0));

        let proposedNewOutflows = [];
        let cashSavedDuringCrunch = 0;

        if (counterOfferMode) {
          const upfront = Math.round(originalAmt * (counterOfferUpfrontPct / 100));

        const rulesApplied = [];

        if (query.includes('hire') || query.includes('recruit') || query.includes('engineer') || query.includes('developer')) {
          const countMatch = query.match(/(\d+)\s*(hire|engineers|people|devs|members)/);
          const salaryMatch = query.match(/(\$|usd)?\s*(\d{1,6})\s*(k|\/mo|each|salary)?/);

          let salary = 4500;
          if (salaryMatch) {
            let num = parseInt(salaryMatch[2], 10);
            if (query.includes('k') && num < 100) num *= 1000;
            salary = num > 100 ? num : 4500;
          }
          setSimNewHireSalary(salary);
          setSimHireHeadcount(count);
          rulesApplied.push(`Adding ${count} hire(s) at ${formatCurrency(salary)}/mo`);
        }

        if (query.includes('late') || query.includes('delay') || query.includes('pays in') || query.includes('pays 20 days')) {
          const daysMatch = query.match(/(\d+)\s*(day|days|d|weeks)/);
          let days = 20;
          if (daysMatch) {
            days = parseInt(daysMatch[1], 10);
            if (query.includes('week')) days *= 7;
          }
          setSimClientDelay(days);
          rulesApplied.push(`Delaying client receivable by ${days} days`);
        }

        if (query.includes('revenue drops') || query.includes('sales down') || query.includes('drop by') || query.includes('%')) {
          const pctMatch = query.match(/(\d+)\s*%/);
          const pct = pctMatch ? parseInt(pctMatch[1], 10) : 25;
          setSimRevenueShock(pct);
          rulesApplied.push(`Simulating ${pct}% top-line revenue decline`);
        }

        if (query.includes('freeze capex') || query.includes('delay capex') || query.includes('cut non-essential')) {
          setSimCapExDelay(true);
          rulesApplied.push('Freezing non-essential CapEx & discretionary spend');
        }

        if (rulesApplied.length > 0) {
          setNlpFeedback({ query: nlpPrompt, rules: rulesApplied });
          showToast('Scenario Simulated', rulesApplied.join(' & '));
        } else {
          setNlpFeedback({
            query: nlpPrompt,
            rules: ['Simulated general liquidity stress (+14 day client slip, $3.5k spend)']

          setSimClientDelay(14);
          setSimNewHireSalary(3500);
          setSimHireHeadcount(1);
        }

      const handleFileUpload = (file) => {

            setParsedPreview(res);

            showToast('CSV Parsing Failed', res.message);
          }
        };
        reader.readAsText(file);
      };

      const commitParsedUpload = () => {

        if (parsedPreview.invoices.length > 0) {
          setInvoices(prev => [...prev, ...parsedPreview.invoices]);

        if (parsedPreview.expenses.length > 0) {

        showToast('Import Complete', `Added ${parsedPreview.invoices.length} receivables and ${parsedPreview.expenses.length} liabilities.`);

      const handleDownloadSampleCSV = () => {

balance,Opening Cash Balance,25000,1,high,Cash
receivable,Enterprise Client Renewal,18000,10,high,Revenue
receivable,Mid-Market SaaS Retainer,9500,24,medium,Revenue
payable,Engineering Payroll,14000,5,high,Payroll
payable,Quarterly Tax Advance,6200,20,high,Tax
payable,Cloud Hosting Cluster,3100,15,high,Vendor
payable,Marketing Agency Retainer,4000,28,low,Discretionary`;

        const blob = new Blob([sample], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'cashflow_sample_template.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

        });

        const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `cashflow_ledger_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);

        const windowStart = Math.max(0, crunchDay - 8);
        const heavyExpenses = [];
        expenses.forEach(e => {

        const delayedOrAtRiskInvoices = invoices.filter(inv => inv.confidence !== 'high' || (inv.dueDate >= windowStart && inv.dueDate <= crunchDay + 5));

        const lateClient = delayedOrAtRiskInvoices[0];

        return {
          severity: 'critical',
          message: `Negative cash threshold breached around Day ${crunchDay} (Trough: ${formatCurrency(lowestExpectedCash)}).`,
          causes: [

            lateClient ? `Pending receivable on "${lateClient.client}" (${formatCurrency(lateClient.amount)}) matures close to the crunch date.` : 'Receivables clearing too late.',

                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                      }
                      setCopiedText(true);
                      setTimeout(() => setCopiedText(false), 2000);
                    }}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all border ${
                      isDark
                        ? 'bg-slate-950 hover:bg-slate-800 text-yellow-400 border-yellow-400/30'
                        : 'bg-slate-100 hover:bg-slate-200 text-slate-800 border-slate-300'
                    }`}
                  >
                    {copiedText ? <Check className="w-3.5 h-3.5 text-emerald-500" /> : <Copy className="w-3.5 h-3.5" />}
                    {copiedText ? 'Copied!' : 'Copy to Clipboard'}
                  </button>

                  <button
                    onClick={() => {
                      if (activeActionModal.type === 'chase') {
                        handleApplyActionExecution(
                          'accelerateAcme',
                          () => setInvoices(prev => prev.map(inv => inv.id === activeActionModal.data?.id ? { ...inv, dueDate: Math.max(2, inv.dueDate - 5), confidence: 'high' } : inv)),
                          'Invoice collection date advanced by 5 days.'
                        );
                      } else {
                        handleApplyActionExecution(
                          'splitVendor',
                          () => setExpenses(prev => prev.map(exp => exp.id === activeActionModal.data?.id ? { ...exp, amount: Math.round(exp.amount / 2), dueDayOfInterval: [20, 45] } : exp)),
                          'Vendor commitment split into two tranches.'
                        );
                      }
                      setActiveActionModal(null);
                    }}
                    className="px-4 py-2 rounded-xl bg-yellow-400 hover:bg-yellow-300 text-slate-950 text-xs font-bold flex items-center gap-1.5 shadow-md"
                  >
                    <Zap className="w-3.5 h-3.5 fill-slate-950" />
                    Apply & Recalculate Curve
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CashFlowCopilot />);
  </script>
</body>
</html>
