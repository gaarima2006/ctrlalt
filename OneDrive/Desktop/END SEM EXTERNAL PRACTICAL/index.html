<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Simple Interest Calculator</h1>

        <div class="input-box">
            <label>Principal Amount (₹)</label>
            <input type="number" id="principal" placeholder="Enter Principal Amount">
        </div>

        <div class="input-box">
            <label>Rate of Interest (%)</label>
            <input type="number" id="rate" placeholder="Enter Rate">
        </div>

        <div class="input-box">
            <label>Time (Years)</label>
            <input type="number" id="time" placeholder="Enter Time">
        </div>

        <button onclick="calculateSI()">Calculate</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
